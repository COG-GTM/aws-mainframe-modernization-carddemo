services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: authfrds-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env (see .env.example)}
      DBNAME: CARDDEMO
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    ports:
      - "127.0.0.1:${DB2_PORT:-50000}:50000"
    volumes:
      - db2data:/database
      - ./db2/init:/var/custom:ro
      - ../../app/app-authorization-ims-db2-mq:/carddemo-legacy:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /database/config/.authfrds-ready"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s

  authfrds-service:
    build: .
    container_name: authfrds-service
    depends_on:
      db2:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:db2://db2:50000/CARDDEMO:retrieveMessagesFromServerOnGetMessage=true;
      SPRING_DATASOURCE_USERNAME: db2inst1
      SPRING_DATASOURCE_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env (see .env.example)}
      AUTHFRDS_API_USER: ${AUTHFRDS_API_USER:?set in .env}
      AUTHFRDS_API_PASSWORD: ${AUTHFRDS_API_PASSWORD:?set in .env}
      AUTHFRDS_API_READER_USER: ${AUTHFRDS_API_READER_USER:?set in .env}
      AUTHFRDS_API_READER_PASSWORD: ${AUTHFRDS_API_READER_PASSWORD:?set in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8080}:8080"

volumes:
  db2data:
