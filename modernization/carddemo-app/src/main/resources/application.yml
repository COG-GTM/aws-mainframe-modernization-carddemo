spring:
  application:
    name: carddemo-app
  datasource:
    url: ${CARDDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CARDDEMO_DB_USER:carddemo}
    password: ${CARDDEMO_DB_PASSWORD:}   # no default; set it in the environment
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500        # VsamDatasetLoader / initial-load bulk inserts
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: never   # Flyway V1 owns the job repository tables
    job:
      enabled: false             # jobs are launched by the in-app scheduler / REST, never at startup
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

carddemo:
  clock:
    zone: UTC
  initial-load:
    on-startup: false            # true in the local profile (docker compose)
    source-dir: ${CARDDEMO_INITIAL_LOAD_SOURCE_DIR:app/data/EBCDIC}
    mode: ${CARDDEMO_INITIAL_LOAD_MODE:replace}   # replace (truncate-and-load) | upsert
    max-rejects: 0
  batch:
    output-dir: ${CARDDEMO_BATCH_OUTPUT_DIR:batch-output}   # dated outputs, ADR-0012
    retain: 5
    scheduler:                   # in-app cron of nightly-cycle (docs/modernization/06-scheduling.md)
      enabled: ${CARDDEMO_SCHEDULER_ENABLED:true}   # web app only; false in the test and golden profiles
      nightly-cycle:
        cron: "${CARDDEMO_NIGHTLY_CYCLE_CRON:0 0 22 * * *}"   # sec min hour dom mon dow, zone carddemo.clock.zone
