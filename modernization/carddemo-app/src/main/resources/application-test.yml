# Automated tests (activated by Surefire/Failsafe, see carddemo-app/pom.xml). The datasource comes from
# Testcontainers (@ServiceConnection), so nothing here points at a real database.
spring:
  main:
    banner-mode: off
  flyway:
    clean-disabled: true
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: WARN
    com.carddemo: INFO
carddemo:
  security:
    jwt:
      secret: ${CARDDEMO_JWT_SECRET:test-only-jwt-secret-for-automated-tests-0123456789}
  batch:
    scheduler:
      enabled: false   # no cron fire in automated tests / CI
  reports:
    async:
      enabled: false   # report requests run on the calling thread (ITs opt in)
