# Automated tests (activated by Surefire/Failsafe, see carddemo-app/pom.xml). The datasource comes from
# Testcontainers (@ServiceConnection), so nothing here points at a real database. The JWT key is a random
# per-JVM value from the test-only com.carddemo.support.RandomJwtSecretForTests (no key is shipped).
spring:
  main:
    banner-mode: off
  flyway:
    clean-disabled: true
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: WARN
    com.carddemo: INFO
carddemo:
  batch:
    scheduler:
      enabled: false   # no cron fire in automated tests / CI
  reports:
    async:
      enabled: false   # report requests run on the calling thread (ITs opt in)
