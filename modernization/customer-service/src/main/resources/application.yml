server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CUSTOMER_DB_USER}
    password: ${CUSTOMER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: customer
  flyway:
    schemas: customer
    default-schema: customer
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
