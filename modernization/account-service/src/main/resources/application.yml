server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${ACCOUNT_DB_USER:carddemo}
    password: ${ACCOUNT_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: account
  flyway:
    schemas: account
    default-schema: account
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
