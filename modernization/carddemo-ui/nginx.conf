# Same origin for the SPA and the API: the browser only ever talks to this server (ADR-0022).
upstream carddemo_app {
  server carddemo-app:8080;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # REST API, OpenAPI document and Swagger UI of carddemo-app
  location /api/ {
    proxy_pass http://carddemo_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /v3/ {
    proxy_pass http://carddemo_app;
    proxy_set_header Host $host;
  }

  location /swagger-ui {
    proxy_pass http://carddemo_app;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: React Router owns every other path (one route per BMS map).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
