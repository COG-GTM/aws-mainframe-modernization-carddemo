spring:
  # Tests run against PostgreSQL in a Testcontainers container (the image docker-compose uses) with
  # the real Flyway migrations, so NUMERIC and CHECK constraints behave as in production. The
  # migrations leave the tables empty; each test inserts the rows it needs.
  datasource:
    url: jdbc:tc:postgresql:16:///carddemo
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: card
  flyway:
    schemas: card
    default-schema: card
    create-schemas: true

carddemo:
  security:
    token-secret: test-only-token-secret-0123456789abcdef
