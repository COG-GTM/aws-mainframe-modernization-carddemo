# Local runtime: PostgreSQL 16 + the CardDemo application (modular monolith, one service) + its web UI.
#   cd modernization && cp .env.example .env    # then set CARDDEMO_DB_PASSWORD
#   docker compose up -d --build --wait
#   curl http://localhost:${CARDDEMO_HTTP_PORT:-8080}/actuator/health
#   open http://localhost:${CARDDEMO_UI_PORT:-8085}/            # React UI (ADR-0022)
# Host ports are overridable (8084 and 5432 are sometimes taken on shared machines).
name: carddemo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CARDDEMO_DB_NAME:-carddemo}
      POSTGRES_USER: ${CARDDEMO_DB_USER:-carddemo}
      POSTGRES_PASSWORD: ${CARDDEMO_DB_PASSWORD:?set CARDDEMO_DB_PASSWORD (copy modernization/.env.example to .env)}
    ports:
      - "${CARDDEMO_BIND_ADDRESS:-127.0.0.1}:${CARDDEMO_DB_PORT:-5432}:5432"
    volumes:
      - carddemo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  carddemo-app:
    build:
      context: ..
      dockerfile: modernization/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: carddemo-app:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${CARDDEMO_PROFILES:-local}
      CARDDEMO_DB_URL: jdbc:postgresql://postgres:5432/${CARDDEMO_DB_NAME:-carddemo}
      CARDDEMO_DB_USER: ${CARDDEMO_DB_USER:-carddemo}
      CARDDEMO_DB_PASSWORD: ${CARDDEMO_DB_PASSWORD:?set CARDDEMO_DB_PASSWORD (copy modernization/.env.example to .env)}
      # JWT signing key (ADR-0017), passed through only when set in the shell/.env; the local profile has a
      # development-only fallback, every other profile refuses to start without it
      CARDDEMO_JWT_SECRET:
      # local profile: the initial-load job loads app/data/EBCDIC (baked into the image) before the app turns healthy
      CARDDEMO_INITIAL_LOAD: ${CARDDEMO_INITIAL_LOAD:-true}
      CARDDEMO_INITIAL_LOAD_MODE: ${CARDDEMO_INITIAL_LOAD_MODE:-replace}
    volumes:
      # cbexport/cbimport generations; cataloged in batch_output_file, so they must outlive the container
      - carddemo-batch-output:/app/batch-output
    ports:
      - "${CARDDEMO_BIND_ADDRESS:-127.0.0.1}:${CARDDEMO_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6

  # React SPA (one page per BMS map) on nginx; proxies /api/, /v3/ and /swagger-ui* to carddemo-app (ADR-0022)
  carddemo-ui:
    build:
      context: carddemo-ui
    image: carddemo-ui:local
    depends_on:
      carddemo-app:
        condition: service_healthy
    ports:
      - "${CARDDEMO_BIND_ADDRESS:-127.0.0.1}:${CARDDEMO_UI_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  carddemo-db:
  carddemo-batch-output:
