spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{0} - %msg%n
logging.level.root=WARN
logging.level.com.carddemo=INFO
logging.level.com.carddemo.modernization.batch.CardDemoBatchApplication=WARN
logging.level.org.springframework.batch.core.launch.support=INFO
logging.level.org.springframework.batch.core.job=INFO
logging.level.org.springframework.batch.core.step.AbstractStep=INFO

# JCL DD -> property mapping; see README.md. Every path can be overridden on its own.
carddemo.encoding=US-ASCII
carddemo.datasets-dir=datasets
carddemo.run-root=runs
carddemo.clock.fixed-instant=
carddemo.clock.zone=
carddemo.posting.chunk-size=100
carddemo.posting.dalytran=${carddemo.datasets-dir}/DALYTRAN.bin
carddemo.posting.tranfile=${carddemo.datasets-dir}/TRANFILE.bin
carddemo.posting.xreffile=${carddemo.datasets-dir}/XREFFILE.bin
carddemo.posting.acctfile=${carddemo.datasets-dir}/ACCTFILE.bin
carddemo.posting.tcatbalf=${carddemo.datasets-dir}/TCATBALF.bin
carddemo.posting.dalyrejs=DALYREJS.bin
carddemo.posting.sysout=CBTRN02C.sysout.txt
carddemo.interest.tcatbalf=${carddemo.posting.tcatbalf}
carddemo.interest.xreffile=${carddemo.posting.xreffile}
carddemo.interest.acctfile=${carddemo.posting.acctfile}
carddemo.interest.discgrp=${carddemo.datasets-dir}/DISCGRP.bin
carddemo.interest.transact=SYSTRAN.bin
carddemo.interest.sysout=CBACT04C.sysout.txt
