services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: carddemo-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-carddemo}
      DBNAME: CARDDEMO
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    ports:
      - "127.0.0.1:${DB2_PORT:-50000}:50000"
    volumes:
      - db2data:/database
      - ./db2/init:/var/custom:ro
      - ../../app/app-transaction-type-db2:/carddemo-legacy:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /database/config/.carddemo-ready"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s

  transaction-type-service:
    build: .
    container_name: transaction-type-service
    depends_on:
      db2:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:db2://db2:50000/CARDDEMO
      SPRING_DATASOURCE_USERNAME: db2inst1
      SPRING_DATASOURCE_PASSWORD: ${DB2_PASSWORD:-carddemo}
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8080}:8080"

volumes:
  db2data:
