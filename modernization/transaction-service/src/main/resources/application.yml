server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${TRANSACTION_DB_USER}
    password: ${TRANSACTION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transaction
  flyway:
    schemas: transaction
    default-schema: transaction
    create-schemas: true
  batch:
    jdbc:
      # The tables are created by Flyway (V3) inside the transaction schema; the Boot initializer
      # would create them unqualified in the default schema instead.
      initialize-schema: never
      table-prefix: transaction.BATCH_
    job:
      enabled: false

carddemo:
  security:
    # HS256 key shared by all five services; no default here, compose supplies a dev-only value.
    token-secret: ${CARDDEMO_TOKEN_SECRET:}
    token-ttl: ${CARDDEMO_TOKEN_TTL:PT8H}
  services:
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    card-url: ${CARD_SERVICE_URL:http://localhost:8083}
  batch:
    # Root of the job output generations: <output-dir>/<JOB>/<yyyyMMdd-HHmmss-SSS>/<DD>.
    # A CLI launch can override it with --output-dir=.
    output-dir: ${BATCH_OUTPUT_DIR:out}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
