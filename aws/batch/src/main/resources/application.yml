spring:
  main:
    banner-mode: off
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo}?currentSchema=${DB_SCHEMA:carddemo}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      initialization-fail-timeout: -1
logging:
  structured:
    format:
      console: ecs
---
spring:
  config:
    activate:
      on-profile: local
logging:
  structured:
    format:
      console: ""
