spring.application.name=carddemo-java-batch
# Jobs never run at startup by default. From the command line, select one with
# --spring.batch.job.enabled=true --spring.batch.job.name=<posttranJob|intcalcJob|creastmtJob>.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1
