server:
  port: ${PORT:8080}

spring:
  application:
    name: carddemo-online
  datasource:
    url: ${CARDDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CARDDEMO_DB_USER:carddemo}
    password: ${CARDDEMO_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (carddemo-data db/migration)
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
