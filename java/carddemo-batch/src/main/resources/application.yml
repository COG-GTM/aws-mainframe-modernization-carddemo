spring:
  application:
    name: carddemo-batch
  datasource:
    url: ${CARDDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${CARDDEMO_DB_USER:carddemo}
    password: ${CARDDEMO_DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (carddemo-data db/migration)
  flyway:
    enabled: true
  batch:
    job:
      enabled: false   # jobs are launched explicitly (scheduler / CLI), never at startup
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
