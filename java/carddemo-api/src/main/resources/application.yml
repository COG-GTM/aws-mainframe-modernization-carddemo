spring:
  application:
    name: carddemo-api
  datasource:
    url: ${BANK_CARDDEMO_DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${BANK_CARDDEMO_DB_USER}
    password: ${BANK_CARDDEMO_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
