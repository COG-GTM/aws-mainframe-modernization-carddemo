name: discovery

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pytest
      - name: Generated dossier is current
        run: python3 docs/discovery/build_discovery.py --check
      - name: Discovery tests
        run: python3 -m pytest -q tests/test_discovery.py
