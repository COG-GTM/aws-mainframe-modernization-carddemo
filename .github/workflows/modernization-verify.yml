name: modernization-verify

on:
  push:
    branches: [main, migration/carddemo-java]
    paths:
      - "modernization/**"
      - ".github/workflows/modernization-verify.yml"
  pull_request:
    paths:
      - "modernization/**"
      - ".github/workflows/modernization-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
