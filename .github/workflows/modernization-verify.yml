name: modernization-verify

on:
  push:
    branches: [main]
    paths:
      - "modernization/**"
      - "app/data/**"
      - ".github/workflows/modernization-verify.yml"
  pull_request:
    paths:
      - "modernization/**"
      - "app/data/**"
      - ".github/workflows/modernization-verify.yml"
  workflow_dispatch:

concurrency:
  group: modernization-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Docker available for Testcontainers
        run: docker info --format 'Docker {{.ServerVersion}}'
      - run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: modernization/**/target/surefire-reports/
          if-no-files-found: ignore
