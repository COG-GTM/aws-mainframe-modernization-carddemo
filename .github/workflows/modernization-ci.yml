name: modernization-ci

# Java 21 build/test gate for modernization/, the GnuCOBOL baseline, the per-job batch equivalence and the end-to-end
# golden set (online scenario + nightly cycle, Java vs GnuCOBOL). PRs on the migration board are stacked (base = previous ticket's branch), so pull_request runs for
# every base branch.
on:
  pull_request:
    paths:
      - "modernization/**"
      - "modernization/carddemo-ui/**"
      - "app/bms/**"
      - "app/cpy-bms/**"
      - "app/cpy/**"
      - "app/cbl/**"
      - "app/data/**"
      - "scripts/baseline/**"
      - "scripts/batch/**"
      - "scripts/golden-set/**"
      - "docs/validation/baseline/**"
      - "docs/validation/golden-set/**"
      - "docs/modernization/dependency-map.json"
      - "Makefile"
      - ".github/workflows/modernization-ci.yml"
  push:
    branches: [main]
    paths:
      - "modernization/**"
      - "modernization/carddemo-ui/**"
      - "app/bms/**"
      - "app/cpy-bms/**"
      - "app/cpy/**"
      - "app/cbl/**"
      - "app/data/**"
      - "scripts/baseline/**"
      - "scripts/batch/**"
      - "scripts/golden-set/**"
      - "docs/validation/baseline/**"
      - "docs/validation/golden-set/**"
      - "docs/modernization/dependency-map.json"
      - "Makefile"
      - ".github/workflows/modernization-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernization-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn verify (JDK 21, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn -B verify
        run: mvn -B -ntp verify -Dcarddemo.test.profiles=test,ci
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = {}
          for kind in ("surefire", "failsafe"):
              t = f = e = s = 0
              for p in glob.glob(f"**/target/{kind}-reports/TEST-*.xml", recursive=True):
                  r = ET.parse(p).getroot()
                  t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
              rows[kind] = (t, f, e, s)
          print("| Plugin | Tests | Failures | Errors | Skipped |\n|---|---|---|---|---|")
          for k, (t, f, e, s) in rows.items():
              print(f"| {k} | {t} | {f} | {e} | {s} |")
          PY
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: modernization/carddemo-app/target/site/jacoco/
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modernization/**/target/surefire-reports/
            modernization/**/target/failsafe-reports/
          if-no-files-found: warn

  compose:
    name: docker compose up + /actuator/health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARDDEMO_DB_PASSWORD: ci-only-not-a-secret
      CARDDEMO_HTTP_PORT: "18080"
      CARDDEMO_DB_PORT: "15432"
      CARDDEMO_UI_PORT: "18085"
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up -d --build --wait
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: curl /actuator/health
        run: |
          docker compose ps
          body="$(curl -fsS "http://localhost:${CARDDEMO_HTTP_PORT}/actuator/health")"
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
      - name: UI reachable on CARDDEMO_UI_PORT (static build + /api proxy)
        run: |
          curl -fsS "http://localhost:${CARDDEMO_UI_PORT}/" | grep -q '<div id="root">'
          curl -fsS "http://localhost:${CARDDEMO_UI_PORT}/menu" | grep -q '<div id="root">'
          curl -fsS "http://localhost:${CARDDEMO_UI_PORT}/api/v1/auth/login" | grep -q '"header"'
          curl -fsS -o /dev/null "http://localhost:${CARDDEMO_UI_PORT}/v3/api-docs"
      - name: initial-load populated PostgreSQL (local profile)
        run: |
          q() { docker compose exec -T postgres psql -U carddemo -d carddemo -tAc "$1"; }
          status="$(q "select e.status from batch_job_execution e join batch_job_instance i using (job_instance_id) where i.job_name = 'initial-load' order by e.job_execution_id desc limit 1")"
          echo "initial-load: $status"; test "$status" = "COMPLETED"
          expected="user_security=10 customer=50 account=50 card=50 card_xref=50 transaction_type=7 transaction_category=18 disclosure_group=51 tran_cat_balance=50 transaction=0 daily_transaction=300"
          for pair in $expected; do
            table="${pair%%=*}"; want="${pair#*=}"; got="$(q "select count(*) from \"$table\"")"
            echo "$table: $got (expected $want)"; test "$got" = "$want"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modernization/carddemo-ui/package-lock.json
      - name: Playwright e2e against the stack (USER0001 + ADMIN001 flows)
        working-directory: modernization/carddemo-ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: modernization/carddemo-ui/playwright-report/
          if-no-files-found: ignore
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # React UI (UNT51-22, ADR-0022): lint, typecheck, vitest, production build. The Playwright e2e suite runs in the
  # compose job against the full stack.
  ui:
    name: UI (Node 20 lint, vitest, vite build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modernization/carddemo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modernization/carddemo-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npx vite build

  baseline:
    name: GnuCOBOL baseline (--fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnucobol
          cobc --version | head -1
      - name: make baseline-check
        run: make baseline-check

  # Java batch jobs vs the GnuCOBOL baseline (UNT51-11): the print jobs run through the CLI of the packaged jar
  # (`java -jar carddemo-app.jar --job=<name>`, golden profile) against PostgreSQL 16, once reading the
  # app/data/ASCII unloads the baseline ran on and once reading the tables filled by initial-load; their SYSOUT,
  # datasets and exit codes must equal docs/validation/baseline/<JOB>/ (scripts/batch/compare_print_jobs.py).
  # The `baseline` job guarantees those committed outputs are what GnuCOBOL produces today. `make batch-equivalence`
  # ends with `make nightly-cycle`: one `--job=nightly-cycle` launch per mode from freshly loaded sample data, every
  # job reading the previous Java job's outputs, all outputs compared (gate g-batch; matrix in the summary).
  batch-equivalence:
    name: batch jobs (print, POSTTRAN, INTCALC, TRANBKP/COMBTRAN/TRANREPT/PRTCATBL, CREASTMT, nightly-cycle) vs GnuCOBOL baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carddemo
          POSTGRES_USER: carddemo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carddemo -d carddemo" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      CARDDEMO_DB_URL: jdbc:postgresql://localhost:5432/carddemo
      CARDDEMO_DB_USER: carddemo
      CARDDEMO_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - name: mvn package (skip tests; the build job runs them)
        run: mvn -B -ntp -f modernization/pom.xml -DskipTests package
      - name: make batch-equivalence
        run: make batch-equivalence
      - name: Summary
        if: always()
        run: |
          cat build/batch-equivalence/nightly-cycle-matrix/REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          for r in build/batch-equivalence/*/REPORT.md; do
            [ "$r" = build/batch-equivalence/nightly-cycle-matrix/REPORT.md ] || cat "$r" >> "$GITHUB_STEP_SUMMARY"
          done 2>/dev/null || true
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-equivalence
          path: build/batch-equivalence/
          if-no-files-found: warn

  # End-to-end golden set (UNT51-23/24, gate g-golden, decision d-verify): make golden-set-check runs
  # scripts/golden-set/run_golden_set.sh unchanged — its own throwaway postgres:16-alpine container (Docker on the
  # runner), initial-load, the 30-step REST scenario under the `golden` profile, the GnuCOBOL cycle on the
  # independently derived after-online files vs --job=nightly-cycle — and fails on any unexplained difference or
  # allow-list entry not matched exactly once, or when the reconciliation it writes (build/golden-set-doc/) is not
  # identical to the newest committed docs/validation/golden-set/<date>/ (Toolchain line normalised). The jar is
  # packaged here with -DskipTests (the build job runs the suite) so this job runs in parallel with the others; the
  # GnuCOBOL compile of the 14 batch programs takes a few seconds, so no binary cache.
  golden-set:
    name: golden set (online scenario + nightly cycle, Java vs GnuCOBOL; reconciliation reproducible)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARDDEMO_JAR: modernization/carddemo-app/target/carddemo-app.jar
      GOLDEN_DOC_DIR: build/golden-set-doc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: jdk
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install GnuCOBOL (as the baseline job), jq and psql (nightly-cycle batch_run queries)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnucobol jq postgresql-client
          cobc --version | head -1
      - name: mvn package (skip tests; the build job runs them)
        run: mvn -B -ntp -f modernization/pom.xml -DskipTests package
      - name: make golden-set-check
        env:
          GOLDEN_JAVA_HOME: ${{ steps.jdk.outputs.path }}
        run: make golden-set-check
      - name: Summary
        if: always()
        run: cat build/golden-set/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reconciliation (docs/validation/golden-set layout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-reconciliation
          path: build/golden-set-doc/
          if-no-files-found: warn
      - name: Upload work directory (datasets, compare reports, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-work
          path: |
            build/golden-set/
            !build/golden-set/cobol/work/
          if-no-files-found: warn
