name: modernization-ci

# Java 21 build/test gate for modernization/ plus the GnuCOBOL baseline the phase-6 equivalence job compares
# against. PRs on the migration board are stacked (base = previous ticket's branch), so pull_request runs for
# every base branch.
on:
  pull_request:
    paths:
      - "modernization/**"
      - "app/cpy/**"
      - "app/cbl/**"
      - "app/data/**"
      - "scripts/baseline/**"
      - "docs/validation/baseline/**"
      - "docs/modernization/dependency-map.json"
      - "Makefile"
      - ".github/workflows/modernization-ci.yml"
  push:
    branches: [main]
    paths:
      - "modernization/**"
      - "app/cpy/**"
      - "app/cbl/**"
      - "app/data/**"
      - "scripts/baseline/**"
      - "docs/validation/baseline/**"
      - "docs/modernization/dependency-map.json"
      - "Makefile"
      - ".github/workflows/modernization-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernization-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn verify (JDK 21, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn -B verify
        run: mvn -B -ntp verify -Dcarddemo.test.profiles=test,ci
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = {}
          for kind in ("surefire", "failsafe"):
              t = f = e = s = 0
              for p in glob.glob(f"**/target/{kind}-reports/TEST-*.xml", recursive=True):
                  r = ET.parse(p).getroot()
                  t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
              rows[kind] = (t, f, e, s)
          print("| Plugin | Tests | Failures | Errors | Skipped |\n|---|---|---|---|---|")
          for k, (t, f, e, s) in rows.items():
              print(f"| {k} | {t} | {f} | {e} | {s} |")
          PY
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: modernization/carddemo-app/target/site/jacoco/
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modernization/**/target/surefire-reports/
            modernization/**/target/failsafe-reports/
          if-no-files-found: warn

  compose:
    name: docker compose up + /actuator/health
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARDDEMO_DB_PASSWORD: ci-only-not-a-secret
      CARDDEMO_HTTP_PORT: "18080"
      CARDDEMO_DB_PORT: "15432"
    defaults:
      run:
        working-directory: modernization
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up -d --build --wait
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: curl /actuator/health
        run: |
          docker compose ps
          body="$(curl -fsS "http://localhost:${CARDDEMO_HTTP_PORT}/actuator/health")"
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
      - name: initial-load populated PostgreSQL (local profile)
        run: |
          q() { docker compose exec -T postgres psql -U carddemo -d carddemo -tAc "$1"; }
          status="$(q "select e.status from batch_job_execution e join batch_job_instance i using (job_instance_id) where i.job_name = 'initial-load' order by e.job_execution_id desc limit 1")"
          echo "initial-load: $status"; test "$status" = "COMPLETED"
          expected="user_security=10 customer=50 account=50 card=50 card_xref=50 transaction_type=7 transaction_category=18 disclosure_group=51 tran_cat_balance=50 transaction=0 daily_transaction=300"
          for pair in $expected; do
            table="${pair%%=*}"; want="${pair#*=}"; got="$(q "select count(*) from \"$table\"")"
            echo "$table: $got (expected $want)"; test "$got" = "$want"
          done
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  baseline:
    name: GnuCOBOL baseline (--fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnucobol
          cobc --version | head -1
      - name: make baseline-check
        run: make baseline-check

  # equivalence (phase 6): needs [build, baseline]; runs the Java batch jobs under the `golden` profile and
  # compares their outputs with docs/validation/baseline/ produced by `make baseline-check`.
